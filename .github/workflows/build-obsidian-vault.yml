name: build-obsidian-vault

# Path-filtered so other stacks in this monorepo cannot trigger a rebuild of the
# agent image. Republishing vault unnecessarily is not harmless: deploying it
# restarts vault-claude, which drops the phone's paired session.
#
# vault-mcp/** is in the filter because this image now BUILDS that Go source:
# vault-claude's move tool is vault-mcp's binary, run over stdio. Leaving it out
# would mean a fix to the deny list in vault.go shipped to the connector and not
# to the agent, which is the exact drift building one binary was meant to remove.
on:
  push:
    branches: [main]
    paths:
      - 'obsidian-vault/**'
      - '!obsidian-vault/**.md'
      - 'vault-mcp/**.go'
      - 'vault-mcp/go.mod'
      - 'vault-mcp/go.sum'
      - '.github/workflows/build-obsidian-vault.yml'
  pull_request:
    paths:
      - 'obsidian-vault/**'
      - '!obsidian-vault/**.md'
      - 'vault-mcp/**.go'
      - 'vault-mcp/go.mod'
      - 'vault-mcp/go.sum'
      - '.github/workflows/build-obsidian-vault.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # -> ghcr.io/<owner>/homelab/obsidian-vault
  IMAGE_NAME: ${{ github.repository }}/obsidian-vault

jobs:
  # Catches the two bug classes found by hand during testing: `[ cond ] && cmd`
  # aborting under `set -e`, and `pipefail` plus a glob over an empty directory.
  # Both failed silently. See obsidian-vault/DECISIONS.md#traps-found-while-building.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, and run the same way locally, because `apt-get install
      # shellcheck` gives whatever Ubuntu packaged that month. Versions differ on
      # which code they emit for the same construct: an older one reported SC2317
      # on trap-invoked function bodies where 0.11 reports SC2329, so CI failed
      # on scripts that passed locally.
      #
      # Reproduce exactly:
      #   cd obsidian-vault && docker run --rm -v "$PWD:/mnt" -w /mnt \
      #     koalaman/shellcheck:v0.11.0 --severity=style --shell=bash scripts/*.sh
      #
      # A glob rather than a list of filenames, which is what this was until a
      # new script was added and had to be remembered here as well. A lint step
      # that silently stops covering a file is the wrong failure to design in.
      # The `cd` is load-bearing: the glob has to expand on the runner, where
      # the files are, and the paths it produces have to be valid inside /mnt.
      - name: shellcheck
        run: |
          cd obsidian-vault
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 \
            --severity=style --shell=bash \
            scripts/*.sh

  build:
    needs: shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The only secret this workflow holds. Automatic, job-scoped, expires
          # with the job. The credentials that matter — Obsidian Sync and the
          # Claude OAuth token — are established by an interactive login inside
          # the container and never enter CI. See obsidian-vault/ARCHITECTURE.md#trust-boundary.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - id: push
        uses: docker/build-push-action@v6
        with:
          # The REPOSITORY ROOT, not ./obsidian-vault: the Dockerfile builds
          # vault-mcp's Go source into this image and a context rooted in the
          # stack directory cannot reach it. Every COPY in the Dockerfile is
          # prefixed accordingly.
          context: .
          file: ./obsidian-vault/Dockerfile
          # Single platform: the NAS is a Celeron J4125, x86-64. Verified
          # building and running on linux/amd64 2026-08-08.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lets deploy.sh refuse images that did not come from this workflow.
      - name: Attest provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
