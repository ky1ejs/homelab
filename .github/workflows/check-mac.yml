name: check-mac

# The Mac Studio's nix-darwin config. This evaluates it, which catches type
# errors, unknown options and failed assertions, on a Linux runner. It cannot
# build or apply it: that needs a Mac, and a macOS runner costs money on every
# push. docs/studio.md has how it is applied.
on:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - '.github/workflows/check-mac.yml'
  pull_request:
    paths:
      - 'mac/**'
      - '.github/workflows/check-mac.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # The inputs come from mac/flake.lock, so this checks the pinned versions,
      # the same ones the Mac applies.
      - name: evaluate the studio config
        run: |
          nix eval --raw ./mac#darwinConfigurations.studio.config.system.build.toplevel.drvPath
          echo
          nix eval --raw ./mac#packages.aarch64-darwin.darwin-rebuild.drvPath
          echo

      - name: lock file is current
        run: |
          nix flake lock ./mac --no-update-lock-file

      # Same pinned image as shellcheck-bin.yml.
      - name: shellcheck mac/apply
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 \
            --severity=style --shell=bash \
            mac/apply

      - name: ascii only
        run: |
          if LC_ALL=C grep -rn '[^ -~	]' mac; then
            echo "::error::mac/ contains non-ASCII characters (see lines above)"
            exit 1
          fi

      - name: executable bit
        run: |
          test -x mac/apply || {
            echo "::error::mac/apply is not executable (git update-index --chmod=+x mac/apply)"
            exit 1
          }
