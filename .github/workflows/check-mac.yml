name: check-mac

# The Mac Studio's nix-darwin config. This evaluates it, which catches type
# errors, unknown options and failed assertions, on a Linux runner. It cannot
# build or apply it: that needs a Mac, and a macOS runner costs money on every
# push. docs/mac-studio.md has how it is applied.
on:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      # The hub's Beszel version, which the mac studio's agent must match.
      - 'monitoring/docker-compose.yml'
      - '.github/workflows/check-mac.yml'
  pull_request:
    paths:
      - 'mac/**'
      # The hub's Beszel version, which the mac studio's agent must match.
      - 'monitoring/docker-compose.yml'
      - '.github/workflows/check-mac.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A third-party action, so pinned to a commit. v31.11.5.
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086

      # Before the eval: without --no-update-lock-file, `nix eval` on a local
      # flake rewrites mac/flake.lock to match flake.nix, and this step would
      # then always pass.
      - name: lock file is current
        run: |
          nix flake lock ./mac --no-update-lock-file

      # The inputs come from mac/flake.lock, so this checks the pinned versions,
      # the same ones the Mac applies.
      - name: evaluate the mac-studio config
        run: |
          nix eval --no-update-lock-file --raw ./mac#darwinConfigurations.mac-studio.config.system.build.toplevel.drvPath
          echo
          nix eval --no-update-lock-file --raw ./mac#packages.aarch64-darwin.darwin-rebuild.drvPath
          echo

      # Same pinned image as shellcheck-bin.yml.
      - name: shellcheck the scripts in mac/
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 \
            --severity=style --shell=bash \
            mac/apply mac/test-apply mac/bootstrap mac/lock-screen \
            mac/claude/heartbeat mac/claude/sync-repos mac/claude/any-session mac/claude/sweep-sessions mac/claude/session-cleanup mac/claude/worker-session mac/claude/worker-attach mac/claude/github-token mac/claude/test-github-token mac/ci/runner mac/ci/drain mac/ci/image-setup mac/ci/build-image mac/ci/heartbeat mac/colima/start mac/cli/homelab mac/cli/test-homelab mac/claude/test-claude mac/app-store/app-store mac/app-store/test-app-store mac/simslim/sim-full mac/simslim/test-sim-full

      # nix-darwin runs shellcheck on the generated activation script when it
      # builds the system, with these excludes, so a warning in an
      # activationScripts snippet stops the apply on the Mac. This catches it
      # here instead.
      - name: shellcheck the activation script
        run: |
          nix eval --no-update-lock-file --raw \
            ./mac#darwinConfigurations.mac-studio.config.system.activationScripts.script.text \
            > "$RUNNER_TEMP/activate"
          docker run --rm -v "$RUNNER_TEMP:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 \
            --exclude=SC2016,SC1112 activate

      # The usage collector's parsers and cost model (mac/usage). Python's
      # standard library only, as on the Mac.
      - name: test mac-usage
        run: |
          python3 -B -m unittest discover -s mac/usage -v

      # mac/apply's arguments and its pull, which runs the pulled copy of
      # itself, against stand-ins for uname, sudo and nix.
      - name: test mac/apply
        run: |
          mac/test-apply

      # The mac studio's CLI (mac/cli), against stand-ins for macOS's
      # commands: its parsing, its user checks and what each command runs.
      - name: test the homelab CLI
        run: |
          mac/cli/test-homelab

      # The sweep's stop of processes left in session folders, the
      # heartbeat's pings and what session-cleanup stops, against stand-ins
      # for lsof, ps, curl and xcrun.
      - name: test the sweep's stop, the heartbeat's pings and session-cleanup
        run: |
          mac/claude/test-claude

      # Which GitHub token gh and git get for each way a command names a
      # repo, against stand-ins for the real gh and curl.
      - name: test github-token
        run: |
          mac/claude/test-github-token

      # Again under bash 3.2, which the mac studio runs it with.
      - name: test github-token under bash 3.2
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt bash:3.2.57 \
            sh -c 'apk add -q --no-cache git && ln -sf /usr/local/bin/bash /bin/bash && bash --version | head -1 && bash mac/claude/test-github-token'

      # The app-store command's tokens, its key checks, and what it sends to
      # App Store Connect and xcodebuild, against stand-ins for both.
      - name: test app-store
        run: |
          mac/app-store/test-app-store

      # sim-full's choice of simulator, its wait for the watch agent and what
      # it passes to simslim, against stand-ins for xcrun, launchctl and
      # simslim.
      - name: test sim-full
        run: |
          mac/simslim/test-sim-full

      # -I skips binary files: mac/wallpaper's PNG is not text.
      - name: ascii only
        run: |
          if LC_ALL=C grep -rnI '[^ -~	]' mac; then
            echo "::error::mac/ contains non-ASCII characters (see lines above)"
            exit 1
          fi

      # The hub and the agent speak one protocol version: a hub upgraded
      # without the agent, or the other way round, can stop reading it.
      - name: the mac studio's Beszel agent matches the hub
        run: |
          agent="$(nix eval --raw --file mac/beszel/release.nix version)"
          hub="$(grep -oE 'image: henrygd/beszel:[0-9.]+' monitoring/docker-compose.yml | cut -d: -f3)"
          if [ "$agent" != "$hub" ]; then
            echo "::error::mac/beszel/release.nix pins ${agent}, monitoring/docker-compose.yml runs the hub at ${hub:-?}"
            exit 1
          fi

      - name: executable bit
        run: |
          for script in mac/apply mac/test-apply mac/bootstrap mac/lock-screen mac/claude/heartbeat mac/claude/sync-repos mac/claude/any-session mac/claude/sweep-sessions mac/claude/session-cleanup mac/claude/worker-session mac/claude/worker-attach mac/claude/github-token mac/claude/test-github-token mac/ci/runner mac/ci/drain mac/ci/image-setup mac/ci/build-image mac/ci/heartbeat mac/colima/start mac/cli/homelab mac/cli/test-homelab mac/claude/test-claude mac/usage/mac-usage mac/app-store/app-store mac/app-store/test-app-store mac/simslim/sim-full mac/simslim/test-sim-full; do
            test -x "$script" || {
              echo "::error::$script is not executable (git update-index --chmod=+x $script)"
              exit 1
            }
          done

      # mac/beszel installs nothing until mac/keys/beszel-hub.pub holds the
      # hub's key, so the checks above never saw its daemon or its activation
      # lines. Last, because it writes a made-up key into the checkout.
      - name: evaluate and shellcheck with a hub key
        run: |
          echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGhTXCGQphIff33c7VX4fss+MBT/qMjWdiXTX7CqCi5w ci' >> mac/keys/beszel-hub.pub
          nix eval --no-update-lock-file --raw ./mac#darwinConfigurations.mac-studio.config.system.build.toplevel.drvPath
          echo
          nix eval --no-update-lock-file --raw \
            ./mac#darwinConfigurations.mac-studio.config.system.activationScripts.script.text \
            > "$RUNNER_TEMP/activate"
          grep -q 'install -d -m 700 -o nobody -g nobody /var/db/beszel-agent' "$RUNNER_TEMP/activate"
          docker run --rm -v "$RUNNER_TEMP:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 \
            --exclude=SC2016,SC1112 activate
