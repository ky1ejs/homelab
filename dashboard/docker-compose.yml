# The dashboard: one page that says what is running and lets you update it.
#
# THREE SERVICES OFF ONE IMAGE, and the split is the entire security design:
#
#   homelab-dash   renders HTML. Published on loopback, reached through
#                  `tailscale serve`. No Docker socket, no checkout, no way to
#                  run a command except by asking the agent.
#   homelab-dashd  holds /var/run/docker.sock and the checkout, read-only.
#                  Publishes no port. Accepts only the closed verb list in
#                  agent.go.
#   homelab-dashu  holds the checkout READ-WRITE and nothing else: no socket,
#                  no published port, no route from the web container. Does
#                  two things, preview and apply, and only when the agent asks.
#                  See updater.go and README.md#updating-the-checkout.
#
# This repo refused to mount the Docker socket three times before this stack
# existed, and those refusals still stand for the containers that made them --
# see obsidian-vault/docker-compose.yml's vault-cron, which would gain nothing
# from it. What changed is that "press a button and it deploys" cannot be built
# without it. The reasoning, and the alternatives assessed, are in
# obsidian-vault/DECISIONS.md#the-dashboard-and-the-docker-socket.
#
# THIS STACK PUBLISHES A PORT, which no other stack in this repo did until
# monitoring/ copied this design for its own page -- and it publishes it ON
# LOOPBACK ONLY. `tailscale serve` on the host node proxies to
# it, terminating TLS with a real certificate and adding the identity header
# this stack authenticates with. It is deliberately NOT on a Funnel: vault-mcp
# and gmail-mcp are the stacks that belong on the internet.
#
# THE LOOPBACK BIND IS A SECURITY CONTROL, NOT A PREFERENCE. Identity comes from
# a header Serve adds, so anything that can open a socket to this listener can
# send that header itself. Publishing on 0.0.0.0 does not merely restore LAN
# access -- it hands the deploy buttons to anything on the LAN. The agent checks
# the daemon for this on every mutating action and refuses them all if it is
# wrong (agent.go's exposure(), asserted in agent_test.go), so getting it wrong
# breaks the dashboard rather than opening it. Do not "fix" that by changing this
# line.

services:
  homelab-dash:
    image: ${IMAGE:?set IMAGE in .env}
    container_name: homelab-dash
    # Pinned for the same reason as every other stack: stable container identity
    # across recreates, and log lines that stay greppable.
    hostname: nas-homelab-dash
    # The unprivileged half. Same UID as everything else here so that if it is
    # ever given a mount, the file ownership story does not change.
    user: "${APP_UID:-1002}:${APP_GID:-100}"
    env_file: [.env]
    environment:
      # BLANKED, because env_file hands every service the whole .env and this
      # one must not hold the updater's token: with it, the container that
      # parses untrusted HTTP could skip the agent and its lock. `environment`
      # beats `env_file`, and the web role refuses to start if this is ever
      # non-empty, so losing this line breaks the page rather than opening it.
      DASH_UPDATER_TOKEN: ""
      DASH_ADDR: :8080
      # By container name over this compose network. There is no host port for
      # the agent, so this is the only way to reach it.
      DASH_AGENT_URL: http://homelab-dashd:8090
      DASH_SELF_STACK: dashboard
      TZ: ${TZ-}
    ports:
      # LOOPBACK ONLY. See the header comment: this is what makes the identity
      # header a credential rather than a suggestion. `tailscale serve` runs on
      # the host and is the only INTENDED client -- but any process in the
      # host's network namespace can reach this too, which is why no container
      # in this repo runs with `network_mode: host` (monitoring/'s agent was
      # moved off it for exactly this listener).
      - "127.0.0.1:${DASH_PORT:-8088}:8080"
    volumes:
      # The host's timezone, read-only. Inferring beats configuring: a TZ typed
      # into .env is a second source of truth that drifts silently.
      - /etc/localtime:/etc/localtime:ro
      # DELIBERATELY ABSENT: the Docker socket and the checkout. This is the
      # container that parses untrusted HTTP, and it holds neither.
    depends_on:
      homelab-dashd:
        condition: service_healthy
    # The default network only. NOT on `updates`: that network is how the agent
    # reaches the updater, and this container has no business reaching it.
    networks: [default]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/homelab-dash", "-healthcheck", "-role=web"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: ${DASH_MEM_LIMIT:-128m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  homelab-dashd:
    image: ${IMAGE:?set IMAGE in .env}
    container_name: homelab-dashd
    hostname: nas-homelab-dashd
    command: ["/usr/local/bin/homelab-dash", "-role=agent"]
    # ROOT, deliberately. The Docker socket on QTS is root-owned, and a
    # container that can talk to the daemon is already root-equivalent on the
    # host -- adding it to a docker group instead would be the same privilege
    # wearing a smaller number. Better to state it plainly than to look safer
    # than it is. Nothing outside this compose network can reach this container.
    user: "0:0"
    env_file: [.env]
    environment:
      DASHD_ADDR: :8090
      DOCKER_HOST: unix:///var/run/docker.sock
      DASH_SELF_STACK: dashboard
      # The service that SERVES THE PAGE. The exposure check has to know which
      # of this project's containers is the web listener -- checking "does any
      # container here publish badly" passed a listing that contained only this
      # agent, which publishes nothing. Must match the service key above.
      DASH_SELF_SERVICE: homelab-dash
      # Must equal the mount path below, NOT a container-local path. See the
      # volumes block.
      REPO_DIR: ${REPO_HOST_PATH:?set REPO_HOST_PATH in .env}
      # Container Station's docker binary is not on a default PATH, but this
      # image ships its own CLI in /usr/local/bin, so the container default is
      # correct here and the host's PATH problem does not apply.
      TZ: ${TZ-}
      # The updater, over the `updates` network. DASH_UPDATER_TOKEN arrives
      # from .env through env_file; the agent refuses to start if it equals
      # DASH_AGENT_TOKEN. Without this line the agent has no updater: the
      # preview button disappears and nothing else changes.
      DASH_UPDATER_URL: http://homelab-dashu:8091
    volumes:
      # The daemon. Read-write, because deploying is a write.
      - /var/run/docker.sock:/var/run/docker.sock
      #
      # MOUNTED AT ITS OWN HOST PATH, NOT AT /repo, AND THIS IS NOT COSMETIC.
      #
      # `docker compose` inside a container is a CLIENT of the host daemon. It
      # resolves relative bind mounts in a stack's compose file against the
      # project directory as the CLIENT sees it, then hands the daemon that
      # absolute path to mount. vault-mcp's compose file has
      # `./funnel.json:/config/funnel.json:ro`; with the checkout at /repo, that
      # would be sent to the daemon as /repo/vault-mcp/funnel.json, which does
      # not exist on the host, and the funnel would come up with an empty serve
      # config. Mounting the checkout at the identical path makes the client's
      # view and the daemon's view the same string, so every relative mount in
      # every stack keeps resolving to the file it means.
      #
      # READ-ONLY: this container deploys stacks, it does not edit them. That is
      # what keeps `homelab env set` off the dashboard -- see
      # README.md#what-it-cannot-do. Moving the checkout is homelab-dashu's job,
      # below, so a compromise of this container still cannot rewrite what its
      # own buttons run.
      - ${REPO_HOST_PATH}:${REPO_HOST_PATH}:ro
      - /etc/localtime:/etc/localtime:ro
      # DELIBERATELY ABSENT: the vault, the snapshot repo, and every credential
      # directory. This container manages container lifecycles; it has no
      # business reading notes.
    # Both: the default network so the web container can reach it, `updates`
    # so it can reach the updater.
    networks: [default, updates]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/homelab-dash", "-healthcheck", "-role=agent"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Higher than the web half because a `docker compose pull` of the agent
    # image runs in this container's process tree.
    mem_limit: ${DASHD_MEM_LIMIT:-512m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  homelab-dashu:
    image: ${IMAGE:?set IMAGE in .env}
    container_name: homelab-dashu
    hostname: nas-homelab-dashu
    command: ["/usr/local/bin/homelab-dash", "-role=updater"]
    # THE CHECKOUT'S OWNER, and never root. This is the container that writes
    # files every other stack then deploys, and git as anyone but the owner
    # either refuses ("dubious ownership") or leaves files the owner cannot
    # update. The updater refuses to start as root and refuses every request
    # if .git is owned by another uid, naming the number to put here. Find it
    # with `ls -ln` on the clone.
    user: "${UPDATER_UID:-1002}:${UPDATER_GID:-100}"
    # NO env_file. It would hand this container DASH_AGENT_TOKEN, the
    # credential for the container that holds the Docker socket. These two
    # values are interpolated from .env by compose instead, and the updater
    # refuses to start if the agent's token is in its environment anyway.
    environment:
      DASHU_ADDR: :8091
      DASH_UPDATER_TOKEN: ${DASH_UPDATER_TOKEN:?set DASH_UPDATER_TOKEN in .env}
      REPO_DIR: ${REPO_HOST_PATH:?set REPO_HOST_PATH in .env}
      TZ: ${TZ-}
    volumes:
      # READ-WRITE: this is the one container allowed to move the checkout.
      # Same path as the agent's mount, so both see the same files at the same
      # names.
      - ${REPO_HOST_PATH}:${REPO_HOST_PATH}
      - /etc/localtime:/etc/localtime:ro
      # DELIBERATELY ABSENT: the Docker socket. Advancing the checkout and
      # deploying from it stay in different containers.
    # Everything but the checkout is read-only, and the scratch space git and
    # gpg need is memory. A repo-controlled route to execution that slipped
    # past updater.go's git flags would find nowhere persistent to write.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # `updates` only: reachable from the agent and nothing else. Not
    # `internal: true`, because it fetches from GitHub.
    #
    # EGRESS IS NOT LIMITED TO GITHUB, though the design asked for it.
    # Compose has no per-destination egress rule; doing it properly needs an
    # egress proxy or host firewall rules, neither of which this repo runs.
    # What bounds it instead: the only network call in updater.go is a fetch
    # from a URL that must equal DASH_UPDATER_REMOTE, over https only.
    networks: [updates]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/homelab-dash", "-healthcheck", "-role=updater"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: ${DASHU_MEM_LIMIT:-256m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  default: {}
  # The agent-to-updater hop. Only those two services are on it.
  updates: {}
