# The builds' web server (mac/builds/compose.yaml), behind the Tailscale
# sidecar. It serves the three files of each build under its random folder,
# and nothing else: no listing, no folder name it did not expect, no dot
# folder (a build being written), no symlink.
server {
    listen 8080;
    server_name _;
    root /builds;
    server_tokens off;
    autoindex off;
    disable_symlinks on;
    index index.html;

    # iOS reads the manifest as a property list and the .ipa as a download.
    types {
        text/html html;
        application/xml plist;
        application/octet-stream ipa;
    }
    default_type application/octet-stream;

    # A build is replaced, not changed, so nothing is worth caching, and an
    # expired one should stop working everywhere at once.
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;

    location ~ "^/[0-9a-f]{32}/(index\.html|manifest\.plist|app\.ipa)?$" {
    }

    location / {
        return 404;
    }
}
