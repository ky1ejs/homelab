# mac/claude/worker-tmux.conf - tmux settings for the server that the
# relogin and worker-shell sessions share. mac/claude/worker-session sources
# it on every start, so a server started before an apply gets the new
# settings too.
# mac/claude/test-worker-tmux drives these bindings with mouse events in the
# tmux version mac/flake.lock pins. docs/mac-studio.md has what they do.

# 50,000 lines of scrollback per pane. tmux 3.7 applies a new limit to
# panes that already exist too.
set-option -g history-limit 50000

# Mouse mode lets a laptop's trackpad scroll a pane's history and a drag
# select text, instead of the terminal sending arrow keys. A copy reaches the
# laptop's clipboard through tmux's defaults: set-clipboard is external, and
# terminal-features give xterm* terminals OSC 52. worker-attach falls back to
# TERM=xterm-256color, which matches too.
set-option -g mouse on

# With mouse mode on, tmux's default wheel bindings send a full-screen
# program (less, man, top) mouse events it never asked for, so it no longer
# scrolls. These send such a program arrow keys, as the terminal did before.
bind-key -n WheelUpPane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' "if-shell -F '#{alternate_on}' 'send-keys -N 3 Up' 'copy-mode -e'"
bind-key -n WheelDownPane if-shell -F '#{&&:#{alternate_on},#{!=:#{mouse_any_flag},1}}' 'send-keys -N 3 Down' 'send-keys -M'

# tmux's default copies a selection on release and leaves copy mode, which
# clears the highlight; a double or triple click does the same after 0.3
# seconds. These copy and keep the highlight, so the pane stays in copy mode.
# The wait before each copy is there because tmux drops the OSC 52 it writes
# while the pane waits to be redrawn, which entering copy mode and scrolling
# at the edge both cause.
#
# Copied at the bottom of the history, the client switches to the
# worker-copied table below, so the next key leaves copy mode and goes to the
# shell. Copied scrolled back, the pane stays in copy mode as tmux's does: a
# click clears the highlight, and scrolling to the bottom or q leaves.
# Each copy-mode table is bound separately: tmux uses copy-mode-vi when the
# server starts with vi in $EDITOR or $VISUAL.
bind-key -n DoubleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-selection-no-clear ; switch-client -T worker-copied'
bind-key -n TripleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-selection-no-clear ; switch-client -T worker-copied'

bind-key -T copy-mode MouseDown1Pane select-pane \; send-keys -X clear-selection \; if-shell -F '#{==:#{scroll_position},0}' 'send-keys -X cancel'
bind-key -T copy-mode MouseDragEnd1Pane run-shell -d 0.1 \; send-keys -X copy-selection-no-clear \; if-shell -F '#{==:#{scroll_position},0}' 'switch-client -T worker-copied' \; send-keys -X scroll-exit-on
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-no-clear
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-no-clear

bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection \; if-shell -F '#{==:#{scroll_position},0}' 'send-keys -X cancel'
bind-key -T copy-mode-vi MouseDragEnd1Pane run-shell -d 0.1 \; send-keys -X copy-selection-no-clear \; if-shell -F '#{==:#{scroll_position},0}' 'switch-client -T worker-copied' \; send-keys -X scroll-exit-on
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-no-clear

# worker-copied lasts for one key or mouse event, then tmux goes back to its
# usual tables. A key leaves copy mode and goes on to the shell: send-keys
# with no key sends the one pressed. A click clears the highlight and the
# wheel scrolls, as in copy mode. A triple click's release comes after its
# binding, so it keeps the table. Any other mouse event is dropped.
bind-key -T worker-copied Any if-shell -F '#{!=:#{mouse_x},}' '' 'send-keys -X cancel ; send-keys'
bind-key -T worker-copied MouseDown1Pane select-pane \; send-keys -X cancel
bind-key -T worker-copied MouseUp1Pane switch-client -T worker-copied
bind-key -T worker-copied WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind-key -T worker-copied WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# The status bar says whose shell this is, in magenta rather than tmux's
# green, so a worker pane is not mistaken for one of kylejs's.
set-option -g status-style 'bg=magenta,fg=black'
set-option -g status-left '#[bold] worker@#h #[nobold][#S] '
set-option -g status-left-length 40
