# Systems the Beszel hub monitors, synced on every hub start.
#
# Mounted read-only at /beszel_data/config.yml by docker-compose.yml. The hub
# treats this file as the truth: a system added in the web UI and not listed
# here is DELETED on the next restart, along with its history. Add systems here.
#
# The host is a unix socket in a directory only the hub and the agent mount, so
# the agent opens no TCP port -- not on the LAN, not on loopback. The port is
# ignored for a socket but the hub stores one anyway; 45876 is its default.
#
# `users: []` assigns the system to the first user. Every other account still
# sees it, because the hub runs with SHARE_ALL_SYSTEMS=true -- that is what lets
# the readonly reporter account read this system's history without being
# listed here by email, in a public repo.
systems:
  - name: kyles-nas
    host: /beszel_socket/beszel.sock
    port: 45876
    users: []
