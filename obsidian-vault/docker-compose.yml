# Six services off one image. See ARCHITECTURE.md#services.
#
# Sync and the agents have different lifecycles: an agent is restarted often
# (version bumps, wedged sessions) and that must not interrupt sync.
#
# TWO agents, and the difference between them is the security model rather than
# a division of labour. vault-claude reads the whole vault and has no way to
# send anything out. vault-research has WebSearch and WebFetch and cannot see
# the vault. Findings cross from research to vault via the scratch volume; the
# only thing that crosses the other way is a research brief, through the one
# writable window at <scratch>/jobs, described at vault-claude's volume list
# below. Read the volume lists with that in mind: the mounts ARE the boundary.
# DECISIONS.md#a-third-surface-for-research,
# DECISIONS.md#passing-a-brief-to-the-research-agent.
#
# No ports are published anywhere, on purpose. Remote Control dials out and the
# phone connects through Anthropic's bridge — that is the primary advantage over
# the MCP design, and the reason the UniFi gateway needs no configuration.

x-common: &common
  image: ${IMAGE:?set IMAGE in .env}
  user: "${APP_UID:-1000}:${APP_GID:-100}"
  env_file: [.env]
  environment:
    VAULT_DIR: /vault
    SNAPSHOT_DIR: /snapshots
    BACKUP_DIR: /backups
    # Claude Code logged into a claude.ai subscription fetches that account's
    # connectors at startup and serves them as MCP tools. On 2026-09-05 both
    # agents were found with Gmail, Google Drive, Notion and the vault's own
    # connector loaded, which gave vault-claude a way to send and vault-research
    # the vault. No permission rule covers them: they are named by the account,
    # not by any settings file. Both policy files set disableClaudeAiConnectors
    # as well; this is the same switch reached from the environment, so the
    # guarantee survives a policy file that failed to install or was pinned off
    # with VAULT_SETTINGS_MANAGED=0.
    #
    # It sits in the shared anchor because putting it in vault-claude's own
    # `environment:` would REPLACE this map rather than extend it, and take
    # VAULT_DIR with it. Harmless on the services that never run claude.
    # See ARCHITECTURE.md#trust-boundary.
    ENABLE_CLAUDEAI_MCP_SERVERS: "false"
  volumes:
    # The vault itself. Must be owned by APP_UID:APP_GID or the Mac will see
    # unreadable files while everything here appears to work.
    - ${VAULT_HOST_PATH:?set VAULT_HOST_PATH in .env}:/vault
    # The git repo — deliberately OUTSIDE the vault so no .git ever reaches
    # Obsidian's indexer or the sync client.
    - ${SNAPSHOT_HOST_PATH:?set SNAPSHOT_HOST_PATH in .env}:/snapshots
  # NOTE: credentials are deliberately NOT in this shared anchor. Each service
  # mounts only its own. See ARCHITECTURE.md#volumes.
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  vault-sync:
    <<: *common
    container_name: vault-sync
    # Pinned because `ob` reports the hostname to Obsidian Sync as the device
    # name, and Docker defaults it to the container ID. Without this, every
    # recreate registers a NEW device against your Sync account and the device
    # list fills with indistinguishable one-off Linux entries.
    hostname: nas-vault-sync
    command: ["/usr/local/lib/vault/sync.sh"]
    restart: unless-stopped
    volumes:
      - ${VAULT_HOST_PATH}:/vault
      - ${SNAPSHOT_HOST_PATH}:/snapshots
      # Obsidian Sync credentials ONLY. The agent has no use for these.
      - ${SYNC_HOME_HOST_PATH:?set SYNC_HOME_HOST_PATH in .env}:/home/app

  vault-claude:
    <<: *common
    container_name: vault-claude
    # Stable for the same reason, and so the `attach with:` hint agent.sh logs
    # stays copy-pasteable across recreates.
    hostname: nas-vault-claude
    command: ["/usr/local/lib/vault/agent.sh"]
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ${VAULT_HOST_PATH}:/vault
      - ${SNAPSHOT_HOST_PATH}:/snapshots
      # Claude OAuth token ONLY. Split from the sync credentials so a
      # prompt-injected agent reading its own filesystem cannot also walk away
      # with your Obsidian Sync login. See ARCHITECTURE.md#trust-boundary.
      - ${AGENT_HOME_HOST_PATH:?set AGENT_HOME_HOST_PATH in .env}:/home/app
      # The research agent's output, READ-ONLY. This is the handoff:
      # vault-research writes findings here, and this agent files what is worth
      # keeping into the vault, where the stamp hook and the snapshot repo pick
      # it up like any other write.
      #
      # :ro for two reasons. The volume belongs to the other agent, and this one
      # only ever needs to copy out of it. And scratch-sweep.sh must stay the
      # only thing that deletes there — read-only keeps that true by
      # construction rather than by a deny rule someone can get wrong.
      #
      # This does NOT weaken the split. What crosses here is untrusted content
      # arriving at the surface that has no way out, which is the same shape as
      # the clippings already in the Inbox. The direction that must never exist
      # is the reverse one: the vault reaching vault-research.
      - ${SCRATCH_HOST_PATH:?set SCRATCH_HOST_PATH in .env}:/scratch:ro
      # ...and ONE writable window inside it: the jobs directory.
      #
      # Nested on purpose. Docker applies mounts shortest destination first, so
      # /scratch lands read-only and this lands read-write on top of it. The
      # result is an agent that can write briefs into jobs/ and nothing else on
      # the volume — research output stays unwritable, and scratch-sweep.sh
      # stays the only thing that deletes there. Both properties are enforced by
      # the kernel rather than by a rule, which matters here more than usual:
      # `Write(path)` permission rules are accepted and NEVER consulted by
      # Claude Code, so a deny list could not have expressed this at all. See
      # vault-claude-settings.json under SYNTAX.
      #
      # WHY THIS DIRECTION. The handoff needed a way for a brief to reach
      # vault-research without a human retyping it into a phone. The obvious
      # shape — a directory in the vault, mounted into vault-research — would
      # have put a slice of the vault inside the container that holds WebSearch
      # and WebFetch, and would have made research.sh's tripwire something to
      # write an exception to. This inverts it: the meeting point is on the
      # volume vault-research ALREADY has in full, and the new access belongs to
      # the agent that has no way out. vault-research's mount list is unchanged.
      #
      # THE COST IS REAL AND IS NOT ZERO. This is a path from the vault side to
      # the web side, and it did not exist before. vault-claude reads clipped
      # articles and forwarded mail; if one of them talks it into writing note
      # contents into a job, vault-research can read that and reach the network.
      # What bounds it: only text the model itself authors crosses (move_file is
      # rooted at /vault and refuses scratch paths, and Write cannot produce
      # binary), the crossing is a file a human can read, and JOBS.md tells the
      # receiving agent to refuse a job that asks it to send anything anywhere.
      # That is containment and audit, not prevention.
      # See DECISIONS.md#passing-a-brief-to-the-research-agent.
      #
      # The host directory must exist: Docker cannot create a mount point inside
      # a read-only bind mount, so a missing jobs/ is a container that will not
      # start. preflight.sh checks it and research.sh creates it on the volume it
      # owns read-write.
      - ${SCRATCH_HOST_PATH}/jobs:/scratch/jobs
    # Claude Code wants 4 GB minimum, 8 GB recommended. The NAS has ~11.7 GB
    # free, so this cap exists to protect QTS and the other containers, not
    # because the agent is expected to approach it.
    mem_limit: ${AGENT_MEM_LIMIT:-6g}

  # The research surface: web search, web fetch, and no vault.
  #
  # It does NOT use the *common anchor, and that is the single most important
  # line in this file. The anchor mounts the vault and the snapshot repo into
  # every service that uses it. This container has WebSearch and WebFetch, so
  # inheriting those mounts would put private data, untrusted web content and a
  # way out into one session — the combination vault-claude's deny list exists
  # to prevent. The duplication below is the price of that not happening by
  # inheritance one day when somebody edits the anchor.
  #
  # research.sh refuses to start if /vault or /snapshots is present anyway, so
  # this is stated twice on purpose: once here where it is easy to break, once
  # at runtime where breaking it is caught.
  # See DECISIONS.md#a-third-surface-for-research.
  vault-research:
    image: ${IMAGE:?set IMAGE in .env}
    user: "${APP_UID:-1000}:${APP_GID:-100}"
    env_file: [.env]
    container_name: vault-research
    hostname: nas-vault-research
    command: ["/usr/local/lib/vault/research.sh"]
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      SCRATCH_DIR: /scratch
      # Repeated rather than inherited, because this service does not use the
      # *common anchor. See the note there. Of the two agents this is the one
      # where a connector is worst: it holds the open web, so a loaded vault
      # connector puts private data, untrusted content and egress in one
      # session. vault-research-settings.json sets the matching setting.
      ENABLE_CLAUDEAI_MCP_SERVERS: "false"
      # Pinned here, NOT left to research.sh's ${TMUX_SESSION:-research}
      # default. env_file above loads .env, which sets TMUX_SESSION=vault for
      # the vault agent, so the default never applies and this container's tmux
      # session would be called "vault" — while `homelab attach research` and
      # the script's own header both say "research". A session named after the
      # wrong agent is a confusing thing to debug.
      TMUX_SESSION: ${RESEARCH_TMUX_SESSION:-research}
      # Named so the audit log and any future commit can tell this agent's
      # writes from vault-claude's. Same reasoning as AGENT_GIT_NAME.
      AGENT_GIT_NAME: ${RESEARCH_GIT_NAME:-Claude Research}
      AGENT_GIT_EMAIL: ${RESEARCH_GIT_EMAIL:-research@vault.local}
    volumes:
      # The scratch volume, and nothing else. No vault. No snapshots.
      - ${SCRATCH_HOST_PATH:?set SCRATCH_HOST_PATH in .env}:/scratch
      # Its own Claude credentials, separate from vault-claude's. Two Claude
      # Code instances against one home directory corrupt ~/.claude.json — see
      # ARCHITECTURE.md#invariants — so this is a correctness requirement, not
      # only an isolation one. It needs its own one-time `claude /login`.
      - ${RESEARCH_HOME_HOST_PATH:?set RESEARCH_HOME_HOST_PATH in .env}:/home/app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: ${RESEARCH_MEM_LIMIT:-6g}

  # Deletes scratch topic folders once they are old enough. Separate from
  # vault-cron because that one mounts the snapshot and backup volumes and this
  # one must mount neither: the only thing in this repo that deletes should
  # reach exactly one volume. See scripts/scratch-sweep.sh.
  vault-research-sweep:
    image: ${IMAGE:?set IMAGE in .env}
    user: "${APP_UID:-1000}:${APP_GID:-100}"
    env_file: [.env]
    container_name: vault-research-sweep
    hostname: nas-vault-research-sweep
    command: ["/usr/local/lib/vault/sweep-cron.sh"]
    restart: unless-stopped
    environment:
      SCRATCH_DIR: /scratch
    volumes:
      # Same :? guard as every other host path here. This is the DELETING
      # service, so an unset variable must name itself rather than surface as a
      # malformed volume spec.
      - ${SCRATCH_HOST_PATH:?set SCRATCH_HOST_PATH in .env}:/scratch
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Schedules backup.sh. Keeps the schedule in git rather than in QNAP's
  # /etc/config/crontab, which is untracked and regenerated by firmware updates.
  #
  # Runs backup.sh directly over the same volumes — deliberately NOT `docker
  # run` against a mounted /var/run/docker.sock, which would give this container
  # effective root on the NAS for no benefit. The dashboard/ stack does mount
  # that socket, because deploy buttons cannot work without it; a cron job still
  # gains nothing from it. See DECISIONS.md#the-dashboard-and-the-docker-socket.
  vault-cron:
    <<: *common
    container_name: vault-cron
    hostname: nas-vault-cron
    command: ["/usr/local/lib/vault/cron.sh"]
    restart: unless-stopped
    volumes:
      # Same mounts as `backup`, and for the same reasons: no vault (bundles
      # read the repo, not the work tree) and no credentials at all.
      - ${SNAPSHOT_HOST_PATH}:/snapshots
      - ${BACKUP_HOST_PATH}:/backups

  backup:
    <<: *common
    container_name: vault-backup
    command: ["/usr/local/lib/vault/backup.sh"]
    restart: "no"
    profiles: ["manual"]
    volumes:
      # The vault is not mounted: `git bundle create --all` reads the repo, not
      # the work tree. One less thing the backup path can touch.
      #
      # /snapshots is read-write because pack-objects may need scratch space in
      # objects/pack. If you would rather it were :ro, test a full backup run
      # before trusting it.
      - ${SNAPSHOT_HOST_PATH}:/snapshots
      # No credentials mounted at all — the backup path needs none. The image's
      # own /home/app is used as a scratch HOME and dies with the container.
      # Hybrid Backup Sync points HERE. Never at SNAPSHOT_HOST_PATH.
      - ${BACKUP_HOST_PATH:?set BACKUP_HOST_PATH in .env}:/backups
